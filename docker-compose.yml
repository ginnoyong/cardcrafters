services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cardcrafters
      POSTGRES_PASSWORD: cardcrafters
      POSTGRES_DB: cardcrafters
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cardcrafters -d cardcrafters"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  pgdata: